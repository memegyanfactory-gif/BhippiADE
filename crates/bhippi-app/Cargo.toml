[package]
name = "bhippi-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "bhippi_app"

[[bin]]
name = "bhippi"
path = "src/bin/bhippi.rs"

[[bin]]
name = "bhippi-desktop"
path = "src/bin/bhippi-desktop.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"

[[bin]]
name = "capture-baseline"
path = "src/bin/capture-baseline.rs"

[[bin]]
name = "capture-corpus-tokens"
path = "src/bin/capture-corpus-tokens.rs"

# ADR-0045: `godot_embed::win` is the one FFI module in the product and needs `unsafe`.
# `deny` here so that one module can allow it; every other crate keeps the workspace's
# `forbid`. The clippy rules below are the workspace's, verbatim.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[dependencies]
base64 = "0.22"
bhippi-core = { path = "../bhippi-core" }
bhippi-db = { path = "../bhippi-db" }
bhippi-engine = { path = "../bhippi-engine" }
bhippi-memory = { path = "../bhippi-memory" }
bhippi-providers = { path = "../bhippi-providers" }
bhippi-types = { path = "../bhippi-types" }
chrono = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-typescript = "0.0.11"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-specta = { version = "=2.0.0-rc.24", features = ["javascript", "typescript", "derive"] }
tokio = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
portable-pty = "0.9"

# The embedded Godot viewport (ADR-0045) re-parents the engine window with plain Win32
# calls; a PowerShell bridge on the resize path would lag a frame behind the page.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
async-trait = { workspace = true }
