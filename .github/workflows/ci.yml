# BHP-009 · fmt → clippy → architecture test → build matrix → UI build → IPC freshness.
# INV-060: every PR must pass this on all three desktop platforms.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Tauri's Linux build needs the webview/gtk development headers.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      # Tauri embeds ui/dist. A clean checkout must build it before Rust checks
      # compile the desktop target.
      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build UI for Tauri
        run: npm run build --prefix ui

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes crates/bhippi-types/tests/architecture.rs (INV-036, INV-060).
      - name: Tests (network disabled)
        run: cargo test --workspace

      - name: Headless engine performance report
        if: runner.os == 'Linux'
        env:
          BHIPPI_PERF_ARTIFACT: ${{ github.workspace }}/target/perf/headless.json
        run: cargo test -p bhippi-engine --test perf_budget headless_perf_report_is_machine_readable -- --exact

      - name: Upload headless performance report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: engine-perf-headless
          path: target/perf/headless.json

  ui:
    name: ui build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  ipc-freshness:
    name: ipc bindings fresh (INV-032)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install UI dependencies
        run: npm ci --prefix ui
      - name: Build UI for Tauri
        run: npm run build --prefix ui
      - name: Regenerate bindings
        run: cargo run -p bhippi-app --bin export-bindings
      - name: Fail on dirty generated file
        run: git diff --exit-code -- ui/src/lib/ipc.ts
