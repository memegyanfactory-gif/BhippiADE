[workspace]
members = [
    "crates/bhippi-app",
    "crates/bhippi-core",
    "crates/bhippi-db",
    "crates/bhippi-engine",
    "crates/bhippi-engine-build",
    "crates/bhippi-engine-viewport",
    "crates/bhippi-harvest",
    "crates/bhippi-memory",
    "crates/bhippi-providers",
    "crates/bhippi-publish",
    "crates/bhippi-research",
    "crates/bhippi-seo",
    "crates/bhippi-skills",
    "crates/bhippi-ticker",
    "crates/bhippi-types",
    "crates/bhippi-vision",
    "crates/bhippi-writer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"

[workspace.dependencies]
async-trait = "0.1.81"
blake3 = "1.5.4"
chrono = { version = "0.4.38", features = ["serde"] }
futures-core = "0.3.30"
futures-util = "0.3.30"
keyring = { version = "3.6.3", default-features = false }
reqwest = { version = "0.12.5", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
specta = { version = "=2.0.0-rc.24", features = ["chrono", "derive", "ulid", "serde_json"] }
sqlx = { version = "0.7.4", default-features = false, features = ["chrono", "json", "macros", "migrate", "runtime-tokio-rustls", "sqlite"] }
thiserror = "2.0.3"
tokio = { version = "1.38.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8.14"
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tracing = "0.1.40"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
ulid = { version = "1.1.3", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
