# runner-horizon — Bhippi game project (format v1, Godot runtime)
# Generated by Bhippi. Edit freely; sections are validated on load.
# `runtime` must stay above the first [table] or TOML reads it as part of it.

runtime = "godot"

[game]
id = "01M1JD1KMDPP7BDT3BGCTMX993"
name = "runner-horizon"
version = "0.1.0"
default_scene = "scenes/main.tscn"
engine_track = "scripted"
# What a player sees (GAD-023). An empty title falls back to `name`.
title = ""
description = ""
tags = []

[godot]
# The Godot the project was authored against. Bhippi runs 4.3+ and pins this.
version_pin = "4.7.1"
main_scene = "scenes/main.tscn"
# The BhippiProbe autoload: scripted input and playtest telemetry.
probe = true

[render]
pipeline = "3d"
msaa = 2

[physics]
# Godot owns physics; these values are what the editor reports, not a second engine.
backend = "none"
gravity = [0.0, -9.8, 0.0]

[targets.windows]
enabled = true
[targets.android]
enabled = false
package = "com.example.mygame"
min_sdk = 24
[targets.ios]
enabled = false
bundle_id = "com.example.mygame"
[targets.web]
enabled = true
canvas_fit = "window"

# How this game is published (GAD-092). A key that is not one of these two is
# refused on load rather than ignored.
[publish]
credits = true
web_export_dir = "export/web"

# What the agent may do to this project (ENG-190). Each key is allow / ask / deny;
# anything not listed takes its default.
[agent]
